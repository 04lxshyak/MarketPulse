server:
  port: 8082

spring:
  application:
    name: stock-service

  datasource:
    url: jdbc:postgresql://localhost:5434/stock_db
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

market:
  websocket:
    enabled: ${MARKET_WS_ENABLED:true}
    url: ${MARKET_WS_URL:wss://ws.finnhub.io}
    token: ${FINNHUB_API_KEY:}
    symbols: ${MARKET_WS_SYMBOLS:AAPL,MSFT,NVDA,TSLA}
    reconnect-delay-ms: ${MARKET_WS_RECONNECT_DELAY_MS:5000}
